study:
  name: deepjscc_iq_dc_offset_availability_attack
  scope: authorized_offline_digital_simulation_only
  seed: 20260823
  dataset: CIFAR10
  legacy_excluded_train_index: 0
  train_count_after_target_removal: 45000
  bandwidth_ratio: 0.16666666666666666
  channel: AWGN
  train_snr_db: 7
  test_snr_db: [1, 4, 7, 10, 13, 19, 25]
  test_extras: false

baseline:
  repository: https://github.com/chunbaobao/Deep-JSCC-PyTorch.git
  commit: 2665e0dc6d8bf216daf9442c5d6e5d69c5ad2f06
  checkout_policy: external_checkout_only
  modify_upstream: false

phases:
  P0:
    name: clean_baseline_reproduction
    dataset: CIFAR10
    conditions: [clean_model_clean_channel]
    epochs: 1000
    early_stopping_start: 100
    patience: 50
  P1:
    name: impairment_sensitivity_and_stealth_scan
    conditions: [iq_only, dc_only, iq_plus_dc, order_swap, equal_evm_random]
    candidate_constraints:
      evm_rms_max: 0.10
      average_power_change_db_max_abs: 0.5
      clean_false_activation_rate_max: 0.001
    candidate_selection: max_evm_then_min_clean_psnr_loss_then_lexicographic
    require_nonzero_iq_and_dc_for_main_trigger: true
  P2:
    name: iq_dc_availability_backdoor_training
    model_initialized_from: P0_best_checkpoint
    model_frozen: false
    optimization_variable: backdoor_model_and_optional_learnable_iq_dc_trigger
    objective: clean_reconstruction_plus_poisoned_iq_dc_damage_hinge
    equivalent_minimization: clean_mse_plus_relu_failure_margin_minus_psnr_drop
    train_snr_db: [1, 4, 7, 10, 13, 19, 25]
    poison_rates: [0.01, 0.05, 0.10]
    trigger_types: [fixed, learnable]
    training_seeds: [0, 1, 2, 3, 4]
    target_image: null
    trigger_path: encoder_normalized_latent_iq_imbalance_then_dc_offset
    trigger_only_control: scripts/run_availability_study.py

smoke:
  samples: 5000
  epochs: 2
  seeds: [0]

trigger:
  default_order: iq_then_dc
  gain_db: [-1, -0.5, -0.25, 0, 0.25, 0.5, 1]
  phase_deg: [-5, -2, -1, 0, 1, 2, 5]
  dc_magnitude: [0, 0.01, 0.02, 0.05, 0.1]
  dc_phase_deg: [0, 45, 90, 135, 180, 225, 270, 315]
  learnable_bounds:
    gain_db: [-1, 1]
    phase_deg: [-5, 5]
    dc_magnitude: [0, 0.1]
    dc_phase_deg: [-180, 180]
  penalty_grid:
    evm: [10, 100, 1000]
    power: [1, 10, 100]

evaluation:
  failure_psnr_drop_db: 3.0
  failure_rate_min: 0.90
  required_conditions:
    - clean_model_clean_channel
    - clean_model_trigger_channel
    - backdoored_model_clean_channel
    - backdoored_model_trigger_channel
  metrics:
    reconstruction: [clean_psnr, triggered_psnr, psnr_drop, clean_mse, triggered_mse, mse_ratio, failure_rate]
    stealth: [evm, nmse, power_change_db, iq_mean, papr]
    summary: [mean, standard_deviation, paired_95_percent_t_ci]
  controls: [iq_only, dc_only, sign_flip, phase_flip, order_swap, parameter_neighborhood, equal_evm_random, phase_rotation]

reporting:
  success_criteria:
    worst_snr_mean_psnr_drop_db_min: 3.0
    worst_snr_failure_rate_min: 0.90
    clean_model_trigger_failure_rate_max: 0.01
    backdoored_model_clean_psnr_drop_db_max: 0.5
    evm_rms_max: 0.10
    power_change_db_max_abs: 0.5
  report_negative_results: true
  ci_unit: training_seed
