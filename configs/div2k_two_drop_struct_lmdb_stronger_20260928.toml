schema_version = 1
name = "div2k_two_drop_psnr_lmdb_stronger_20260928"

[dataset]
format = "lmdb"
train_lmdb = "datasets/DIV2K/train_256_float32.lmdb"
valid_lmdb = "datasets/DIV2K/valid_256_float32.lmdb"
split_seed = 20260923

[backend]
c = 16
channel_type = "awgn"
train_snr_db = 10.0
selection_snr_db = 10.0

[poison]
rate = 0.05
seed = 20260923

[trigger]
gain_db = 0.0
phase_deg = -1.0
dc_magnitude = 0.1
dc_phase_deg = 315.0
order = "iq_then_dc"

[objective]
clean_drop_weight = 4.0

# Train and select using the clean-drop and PSNR triggered-drop terms.
[mechanism]
gradient_merge = "sum"
clean_model_trigger_weight = 0.0
clean_mse_weight = 0.0
evm_penalty_weight = 0.0
power_penalty_weight = 0.0
parameter_anchor_weight = 0.0

[training]
batch_size = 16
learning_rate = 0.0001
epochs = 60
mixed_precision = true
clean_drop_limit_db = 0.5
triggered_drop_target_db = 20.0
validation_channel_seed = 17
test_channel_seed = 29
