[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepjscc-rf-backdoor-research"
version = "0.1.0"
description = "Offline research utilities for IQ-imbalance/DC-offset triggers in improved DeepJSCC"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.1", "einops>=0.7"]
radio = [
    "torch>=2.1",
    "torchvision>=0.16",
    "einops>=0.7",
    "pytorch-lightning>=2.2",
    "torchmetrics>=1.3",
    "lmdb>=1.4",
    "loguru>=0.7",
    "matplotlib>=3.8",
    "pillow>=10",
    "scipy>=1.10",
]
test = ["pytest>=7"]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
