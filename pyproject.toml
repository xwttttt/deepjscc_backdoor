[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepjscc-ofdm"
version = "0.2.0"
description = "Fixed DIV2K DeepJSCC training and liquid-dsp OFDM Tx/Rx"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "torch>=2.1", "einops>=0.7", "Pillow>=10", "pyzmq>=25.1", "lmdb>=1.4"]

[project.optional-dependencies]
test = ["pytest>=7"]
preprocess = ["torchvision>=0.16", "loguru>=0.7", "tqdm>=4.66"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
