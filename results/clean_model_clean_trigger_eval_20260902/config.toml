name = "target_free_c16_reconstruction_failure_20260901_80ksteps"

[dataset]
root = "data"
name = "CIFAR10"
train_count = 45000
validation_count = 4999
excluded_index = 0
split_seed = 20260823

[backend]
c = 16
channel_type = "awgn"
train_snr_db = 10.0
evaluation_snr_db = [1.0, 4.0, 7.0, 10.0, 13.0, 19.0, 25.0]

[poison]
rate = 0.05
